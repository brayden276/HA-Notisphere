name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install validation tools
        run: python -m pip install mypy pytest ruff

      - name: Validate package descriptors
        run: |
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/notification_manager/manifest.json > /dev/null

      - name: Lint
        run: ruff check custom_components tests

      - name: Type check
        run: mypy custom_components/notification_manager

      - name: Test
        run: python -m pytest -q -p no:cacheprovider
